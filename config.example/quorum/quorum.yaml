config:
  repo: oh-my-omp/pm-config
  branch: main
  readers:
    council/: [council]
    guardians/: [guardians]
    quorum/: [quorum]
    dispatch/: [dispatch]
    shared/: [council, guardians, quorum, dispatch]
targets:
  macos:
    githubApi: https://api.github.com
    council: http://127.0.0.1:7421
    guardians: http://127.0.0.1:7410
    dispatch: http://127.0.0.1:47593
  web:
    githubApi: http://127.0.0.1:8088/gh
    council: http://127.0.0.1:8088/council
    guardians: http://127.0.0.1:8088/guardians
    dispatch: http://127.0.0.1:8088/dispatch
refreshSeconds: 30
attention:
  sessionFailureHours: 24
  rateLimitPercent: 10
digest:
  keepTools:
    # council plugin
    - pm_draft
    - pm_vote
    - pm_ruling
    - pm_read_issue
    - pm_proxy_read
    # guardians plugin
    - pm_base_ready
    - pm_return_facts
    - pm_reply
    - pm_replace
    - pm_escalate
  foldTools:
    - read
    - grep
    - glob
  showAssistantText: true
  maxBytes: 8000000
filters:
  # Folds every settled issue: decided, superseded and closed.
  hideDecided: true
  humanOnly: false
appearance: system
