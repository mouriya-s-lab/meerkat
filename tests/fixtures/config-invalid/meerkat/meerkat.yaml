config:
  repo: mouriya-s-lab/meerkat-e2e-agenda
  branch: main
  readers:
    council/: [council]
    guardians/: [guardians]
    meerkat/: [meerkat]
    dispatch/: [dispatch]
    shared/: [council, guardians, meerkat, dispatch]
targets:
  macos:
    githubApi: http://github.test
    council: http://council.test
    guardians: http://guardians.test
    dispatch: http://dispatch.test
  web:
    githubApi: http://github.test
    council: http://council.test
    guardians: http://guardians.test
    dispatch: http://dispatch.test
refreshSeconds: soon
attention:
  sessionFailureHours: 24
  rateLimitPercent: 10
digest:
  keepTools:
    - meerkat_draft
    - meerkat_vote
    - meerkat_ruling
    - meerkat_read_issue
    - meerkat_proxy_read
    - meerkat_base_ready
    - meerkat_return_facts
    - meerkat_reply
    - meerkat_replace
    - meerkat_escalate
  foldTools:
    - read
    - grep
    - glob
  showAssistantText: true
  maxBytes: 8000000
filters:
  hideDecided: false
  humanOnly: false
appearance: system
