[package]
name = "meerkat"
version = "0.1.0"
edition = "2024"
publish = false
description = "Meerkat: a console for the council, guardians and workers; an NSH app for macOS and the web."

[workspace]

[dependencies]
base64 = "0.23"
futures-util = "0.3"
jiff = "0.2"
log = "0.4"
nsh-base = "0.5"
nsh-core = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
sha1 = "0.11"

[dev-dependencies]
nsh-engine = "0.5"
nsh-testing = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
env_logger = "0.11"
nsh-platform-macos = { version = "0.5", default-features = false }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSLocale", "NSString"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
jiff = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = ["Location", "Navigator", "Window"] }
