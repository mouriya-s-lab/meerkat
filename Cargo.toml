[package]
name = "quorum"
version = "0.1.0"
edition = "2024"
publish = false
description = "Quorum: a dashboard for the council, guardians and workers; an NSH app for macOS and the web."

[workspace]

[dependencies]
base64 = "0.22"
futures-util = "0.3"
jiff = "0.2"
log = "0.4"
nsh-base = "0.4"
nsh-core = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml_ng = "0.10"
sha1 = "0.10"

[dev-dependencies]
nsh-engine = "0.4"
nsh-testing = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
env_logger = "0.11"
nsh-platform-macos = { version = "0.4", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
jiff = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = ["Location", "Window"] }
